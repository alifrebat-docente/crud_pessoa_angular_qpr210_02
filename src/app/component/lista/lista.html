<div id="div-lista">
    <h1> Lista Pessoa </h1>

    <div id="div-lista-pessoas">
        @for(elem of listaPessoa(); track elem.id ){
            <div class="div-item-pessoa">
                <span class="item-pessoa">
                    {{elem.id}} - {{elem.nome}} - {{elem.cpf}} - {{elem.dataNascimento}} - {{elem.email}} - {{elem.uf?.nome}} - {{elem.municipio}}
                </span>
                <span class="btns-lista">
                    <a class="lnk-editar" (click)="buscarPorId(elem)"> Editar </a>
                    <a class="lnk-excluir"  (click)="exluir(elem)"> Excluir </a>
                </span>
            </div>
        }@empty{
            <div class="div-item-pessoa">
                NENHUM REGISTRO NA LISTA
            </div>
        }

    </div>


</div>
